<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Decision Tree V42 Prototype</title>
</head>
<body style="font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; padding:24px;">

<div id="dtree" style="max-width:900px;margin:0 auto;padding:18px;border:1px solid #eee;border-radius:14px;">
  <h2 style="margin:0 0 6px;">Decision Tree (V42 Prototype)</h2>
  <p style="margin:0 0 18px;color:#666;">Conditional logic demo (questions + outcome text only).</p>

  <div id="dt-card" style="padding:16px;border:1px solid #eee;border-radius:12px;">
    <h3 id="dt-question" style="margin:0 0 10px;"></h3>
    <div id="dt-options" style="display:flex;gap:10px;flex-wrap:wrap;"></div>
    <p id="dt-help" style="margin:12px 0 0;font-size:14px;color:#666;"></p>
  </div>

  <div id="dt-outcome-wrap" style="display:none;margin-top:16px;padding:16px;border:1px solid #eee;border-radius:12px;">
    <h3 style="margin:0 0 8px;">Outcome</h3>
    <p id="dt-outcome" style="margin:0;color:#444;line-height:1.5;"></p>

    <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;">
      <button type="button" id="dt-back"
        style="padding:10px 14px;border:1px solid #ccc;background:#fff;border-radius:10px;cursor:pointer;">
        Back
      </button>
      <button type="button" id="dt-reset"
        style="padding:10px 14px;border:1px solid #ccc;background:#f7f7f7;border-radius:10px;cursor:pointer;">
        Reset
      </button>
    </div>
  </div>
</div>

<script>
(function(){
  const root = document.getElementById("dtree");
  const qEl = document.getElementById("dt-question");
  const optEl = document.getElementById("dt-options");
  const helpEl = document.getElementById("dt-help");

  const outcomeWrap = document.getElementById("dt-outcome-wrap");
  const outcomeEl = document.getElementById("dt-outcome");

  const backBtn = document.getElementById("dt-back");
  const resetBtn = document.getElementById("dt-reset");

  // --------------------------------------------
  // V42 FLOW (from your mindmap)
  // Nodes are either:
  //  - type: "q" (question with options)
  //  - type: "outcome" (final text)
  // --------------------------------------------

  const NODES = {
    start: {
      type: "q",
      question: "How can we help?",
      help: "Choose one option to continue.",
      options: [
        { label: "I have a challenge", next: "peer_status" },
        { label: "We are an initiative", next: "initiative_type" },
        { label: "I have a solution", next: "solution_relate" }
      ]
    },

    // --- CHALLENGE PATH (with Peer Partner status) ---
    peer_status: {
      type: "q",
      question: "Are you already a Peer Partner or are you new to Scope 3 Peer Group?",
      help: "",
      options: [
        { label: "Existing peer", next: "challenge_type" },
        { label: "New peer", next: "challenge_type" }
      ]
    },

    challenge_type: {
      type: "q",
      question: "What type of challenge do you have?",
      help: "",
      options: [
        { label: "Industry specific challenge", next: "industry_specific_challenge_info" },
        { label: "Cross industry challenge", next: "challenge_relate" }
      ]
    },

    industry_specific_challenge_info: {
      type: "outcome",
      text: [
        "Path: Challenge → Industry specific challenge.",
        "",
        "Next action (from diagram): Click here to join your industry initiative.",
        "",
        "Demo note: In a full build, this would route to the correct industry initiative join page or lead capture."
      ].join("\n")
    },

    challenge_relate: {
      type: "q",
      question: "What does your challenge relate to?",
      help: "Select an area to continue.",
      options: [
        { label: "Strategy & standards", next: "challenge_area_strategy" },
        { label: "Procurement support", next: "challenge_area_procurement" },
        { label: "Tech & data", next: "challenge_area_tech" },
        { label: "Supplier engagement", next: "challenge_area_supplier_engagement" },
        { label: "Actual decarbonization", next: "challenge_area_decarb" }
      ]
    },

    // Challenge area → Industry supply breakdown (only shown on the diagram)
    challenge_area_supplier_engagement: {
      type: "q",
      question: "In which area?",
      help: "Supplier engagement → choose a sector.",
      options: [
        { label: "Suppliers", next: "challenge_supplier_category" },
        { label: "Power", next: "challenge_outcome_generic" },
        { label: "Energy", next: "challenge_outcome_generic" },
        { label: "Heat", next: "challenge_outcome_generic" },
        { label: "Financing", next: "challenge_outcome_generic" }
      ]
    },

    challenge_supplier_category: {
      type: "q",
      question: "In which category?",
      help: "Suppliers → choose a category.",
      options: [
        { label: "Supply chemicals", next: "challenge_outcome_generic" },
        { label: "Supply materials", next: "challenge_outcome_generic" }
      ]
    },

    // Other areas just go to outcome for the prototype
    challenge_area_strategy: { type:"outcome", text: "Path: Challenge → Strategy & standards.\n\nOutcome: (Demo) Show relevant Groups, Peer Package Meetings, Tools, Initiatives, Solutions." },
    challenge_area_procurement: { type:"outcome", text: "Path: Challenge → Procurement support.\n\nOutcome: (Demo) Show relevant Groups, Peer Package Meetings, Tools, Initiatives, Solutions." },
    challenge_area_tech: { type:"outcome", text: "Path: Challenge → Tech & data.\n\nOutcome: (Demo) Show relevant Groups, Peer Package Meetings, Tools, Initiatives, Solutions." },
    challenge_area_decarb: { type:"outcome", text: "Path: Challenge → Actual decarbonization.\n\nOutcome: (Demo) Show relevant Groups, Peer Package Meetings, Tools, Initiatives, Solutions." },

    challenge_outcome_generic: {
      type: "outcome",
      text: [
        "Path: Challenge → Supplier Engagement / Sector or Supplier Category.",
        "",
        "Outcome (from diagram):",
        "• Groups",
        "• Peer package meetings",
        "• Tools",
        "• Initiatives",
        "• Solutions",
        "",
        "Demo note: In a full build, this would filter content based on the chosen sector/category."
      ].join("\n")
    },

    // --- INITIATIVE PATH ---
    initiative_type: {
      type: "q",
      question: "What type of initiative do you have?",
      help: "",
      options: [
        { label: "Industry initiative", next: "initiative_outcome" },
        { label: "Cross-industry initiative", next: "initiative_outcome" }
      ]
    },

    initiative_outcome: {
      type: "outcome",
      text: [
        "Path: We are an initiative.",
        "",
        "Outcome (from diagram): Initiative Support Services / External Initiatives.",
        "",
        "Demo note: In a full build, this would route to initiative support + relevant next steps."
      ].join("\n")
    },

    // --- SOLUTION PATH ---
    solution_relate: {
      type: "q",
      question: "What does your solution relate to?",
      help: "Select an area to continue.",
      options: [
        { label: "Strategy & standards", next: "solution_topics" },
        { label: "Procurement support", next: "solution_topics" },
        { label: "Tech & data", next: "solution_topics" },
        { label: "Supplier engagement", next: "solution_topics" },
        { label: "Actual decarbonization", next: "solution_topics" }
      ]
    },

    solution_topics: {
      type: "q",
      question: "Select a topic (example set from V42)",
      help: "These map to the labels shown under outcomes in the diagram.",
      options: [
        { label: "SBTI / GHG Protocol consultations", next: "solution_outcome" },
        { label: "Strategy Day", next: "solution_outcome" },
        { label: "Scope 3 Maturity Benchmark", next: "solution_outcome" },
        { label: "Scope 3 Governance", next: "solution_outcome" },
        { label: "Scope 3 Innovation", next: "solution_outcome" }
      ]
    },

    solution_outcome: {
      type: "outcome",
      text: [
        "Path: I have a solution.",
        "",
        "Outcome (from diagram):",
        "• Groups",
        "• Meetings",
        "• Tools",
        "• Initiatives",
        "",
        "Partner Packages (from V42):",
        "• Strategy Days",
        "• Tools Clinic",
        "• Scope 3 Podcast",
        "• Solution Profile",
        "• Event",
        "• Partnership",
        "• Market Insights",
        "",
        "Demo note: In a full build, this would publish the correct ‘Solution’ + partner package recommendations."
      ].join("\n")
    }
  };

  // ---------------------------
  // RUNTIME
  // ---------------------------
  let history = [];
  let currentId = "start";

  function btnStyle(){
    return "padding:10px 14px;border:1px solid #ccc;background:#fff;border-radius:10px;cursor:pointer;";
  }

  function renderNode(id){
    const node = NODES[id];
    if(!node) {
      qEl.textContent = "Missing node: " + id;
      optEl.innerHTML = "";
      helpEl.textContent = "";
      return;
    }

    currentId = id;

    if(node.type === "q"){
      // Show question card
      document.getElementById("dt-card").style.display = "";
      outcomeWrap.style.display = "none";

      qEl.textContent = node.question;
      helpEl.textContent = node.help || "";
      optEl.innerHTML = "";

      node.options.forEach(opt => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = opt.label;
        b.style.cssText = btnStyle();
        b.addEventListener("click", () => {
          history.push(id);
          renderNode(opt.next);
        });
        optEl.appendChild(b);
      });
    } else {
      // Show outcome
      document.getElementById("dt-card").style.display = "none";
      outcomeWrap.style.display = "";

      // Preserve line breaks
      outcomeEl.innerHTML = (node.text || "").replace(/\n/g, "<br>");
    }
  }

  backBtn.addEventListener("click", () => {
    const prev = history.pop();
    if(prev) renderNode(prev);
  });

  resetBtn.addEventListener("click", () => {
    history = [];
    renderNode("start");
    root.scrollIntoView({ behavior: "smooth", block: "start" });
  });

  renderNode("start");
})();
</script>

</body>
</html>
